<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4550a8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Портал преподавателя · Анонимная обратная связь</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css?v=1.0.6" />
    <link rel="stylesheet" href="/css/dashboard.css?v=1.0.6" />
  </head>
  <body class="app-shell">
    <header class="site-header">
      <div class="container">
        <a class="brand" href="/portal/">
          <span>Портал преподавателя</span>
        </a>
        <span class="nav-spacer"></span>
        <nav class="nav-links" aria-label="Действия">
          <span class="badge" id="user-badge">…</span>
          <a class="btn btn-sm btn-ghost" href="/" id="students-link" target="_blank" rel="noopener">Страница студентов</a>
          <button class="btn btn-sm btn-ghost" type="button" id="logout-button">Выйти</button>
        </nav>
      </div>
    </header>

    <div class="container app-body">
      <aside class="sidebar">
        <nav class="side-nav" id="side-nav" aria-label="Разделы"></nav>
        <div class="card card-tight" id="sidebar-note"></div>
      </aside>

      <main class="app-main">
        <div id="view-alerts"></div>
        <div id="view-root">
          <div class="card"><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
      </main>
    </div>

    <footer class="site-footer">
      <div class="container">
        <p class="tiny">
          Данные обезличены: в базе нет имён, групп и адресов студентов. Результаты показываются
          обезличенно, при малом числе ответов - скрываются.
        </p>
      </div>
    </footer>

    <script type="module" src="/js/portal.js?v=1.0.6"></script>
