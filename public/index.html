<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4f70" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Анкеты по занятиям и дисциплинам</title>
    <meta
      name="description"
      content="Анонимные анкеты студентов: оценка проведенного занятия и итоговая оценка дисциплины."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container container-narrow">
      <h1>Анкеты по занятиям и дисциплинам</h1>
      <p>
        Выберите дисциплину и заполните анкету. Опрос анонимный: фамилия, номер группы и другие
        сведения о студенте не запрашиваются и не сохраняются.
      </p>

      <div class="card">
        <div class="field">
          <label class="label" for="discipline-select">Дисциплина</label>
          <select class="select" id="discipline-select"></select>
        </div>
        <a class="btn btn-primary btn-block" id="open-form" href="/form.html">Перейти к анкете</a>
      </div>

      <div id="status"></div>
    </main>

    <script type="module" src="/js/landing.js"></script>
  </body>
</html>
