<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4550a8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Вход · Анонимная обратная связь</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css?v=1.0.31" />
  </head>
  <body>
    <main class="container container-narrow">
      <section class="section">
        <div class="card card-auth">
          <h1 id="login-title">Вход в систему</h1>
          <div id="alerts"></div>

          <form id="login-form" autocomplete="on" novalidate>
            <div class="field">
              <label class="label" for="login">Логин</label>
              <input
                class="input"
                id="login"
                name="login"
                type="text"
                autocomplete="username"
                required
                autocapitalize="none"
                spellcheck="false"
              />
            </div>
            <div class="field">
              <label class="label" for="password">Пароль</label>
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary btn-lg" type="submit" id="login-submit">
              Войти
            </button>
          </form>

          <form id="password-form" class="hidden" novalidate>
            <div class="alert alert-warn">
              Это первый вход с временным паролем. Придумайте свой пароль: не менее 10 символов,
              минимум два вида символов.
            </div>
            <div class="field">
              <label class="label" for="new-password">Новый пароль</label>
              <input class="input" id="new-password" type="password" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label class="label" for="new-password-2">Повторите новый пароль</label>
              <input class="input" id="new-password-2" type="password" autocomplete="new-password" required />
            </div>
            <button class="btn btn-primary btn-lg" type="submit" id="password-submit">
              Сохранить пароль и продолжить
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="/js/login.js?v=1.0.31"></script>
  </body>
</html>
