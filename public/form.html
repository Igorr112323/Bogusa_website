<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Анкета · Анонимная обратная связь</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>

    <header class="site-header">
      <div class="container">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>
            Анонимная обратная связь
            <small id="header-subtitle">заполнение анкеты</small>
          </span>
        </a>
        <span class="nav-spacer"></span>
        <span class="badge badge-ok">Без ФИО и группы</span>
      </div>
    </header>

    <main class="container container-narrow" id="main">
      <div class="steps" id="steps" aria-label="Этапы заполнения"></div>
      <div id="alerts"></div>
      <div id="step-content" aria-live="polite"></div>
      <div class="sticky-actions" id="actions"></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="tiny">
          Ответы сохраняются анонимно. IP-адрес не хранится в базе и используется только для защиты
          от спама.
        </p>
      </div>
    </footer>

    <script type="module" src="/js/form.js"></script>
  </body>
</html>
